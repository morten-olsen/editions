# Build the marketing site (Astro) and the design-system Storybook, and
# publish them to two independent path mounts on the homelab pages server:
#
#   https://mortenolsen.pro/editions/                — Astro
#   https://mortenolsen.pro/editions/design-system/  — Storybook
#
# The pages server resolves longest-prefix first, so /editions/design-system
# requests hit the Storybook mount and never fall through to the Astro mount.
# Publishing one does not invalidate the other.
#
# Runs in parallel with the existing GitHub Pages deploy (.github/workflows/
# website.yml). Once the migration is complete, delete that workflow.

when:
  - event: [push, manual]
    branch: main
    path:
      - 'apps/website/**'
      - 'apps/web/.storybook/**'
      - 'apps/web/src/**/*.stories.*'
      - 'apps/web/src/**/*.mdx'
      - '.woodpecker/deploy.yaml'

steps:
  build:
    image: code.olsen.cloud/ci/mise:latest
    environment:
      ASTRO_SITE: https://mortenolsen.pro
      ASTRO_BASE: /editions
    commands:
      # Astro + Storybook builds don't need the server's native modules — use
      # ci:install (which skips postinstall scripts) so we don't need python3
      # in this step.
      - mise install
      - task ci:install
      - task build:site
      # TODO: re-enable once Storybook segfault during Vite chunk rendering
      # is resolved (likely native-module / memory issue in the runner).
      # - task build:storybook

  publish-site:
    image: code.olsen.cloud/ci/pages-deploy:latest
    settings:
      host: mortenolsen.pro
      path: /editions
      dir: ./apps/website/dist
      token:
        from_secret: pages_admin_token
    depends_on: [build]

  # TODO: re-enable once Storybook builds without segfaulting in the runner.
  # publish-storybook:
