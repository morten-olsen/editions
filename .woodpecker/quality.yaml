# Build, type-check, lint, test. Runs on every PR and every push.
# All real work lives in the Taskfile so `task ci:quality` reproduces this
# locally byte-for-byte.

when:
  - event: [push, pull_request, manual]

steps:
  quality:
    image: code.olsen.cloud/ci/mise:latest
    commands:
      # better-sqlite3 has no Node 24 prebuilds yet, so it compiles from source
      # via node-gyp. The mise image already has build-essential; only Python
      # is missing.
      - apt-get update && apt-get install -y --no-install-recommends python3
      - mise install
      - task ci:quality
