version: "3"

vars:
  SERVER_DIR: apps/server
  WEB_DIR: apps/web
  WEBSITE_DIR: apps/website
  SMOKE_PORT: 3199
  PORTLESS_PREFIX:
    sh: |
      if [ "$(git rev-parse --git-common-dir 2>/dev/null)" != "$(git rev-parse --git-dir 2>/dev/null)" ]; then
        echo "$(git branch --show-current | tr '/' '-')."
      fi

tasks:
  default:
    desc: List available tasks
    cmds:
      - task --list

  install:
    desc: Install all dependencies
    cmds:
      - pnpm install

  ci:install:
    desc: Install with frozen lockfile, no postinstall scripts (CI-only)
    cmds:
      # The mise runner image doesn't enable corepack shims after Node install
      # (node.corepack default behaviour varies by mise version), so do it
      # explicitly. Idempotent.
      - corepack enable
      # --ignore-scripts: skip native module compilation (better-sqlite3 needs
      # python3 + g++ which aren't in the runner image). Tasks that actually
      # need the native modules (ci:quality) run ci:rebuild-native afterwards
      # in a step that has installed the build deps.
      - pnpm install --frozen-lockfile --ignore-scripts

  ci:rebuild-native:
    desc: Rebuild native modules listed in pnpm.onlyBuiltDependencies
    cmds:
      - pnpm rebuild

  dev:
    desc: Start server and web app in dev mode
    deps: [dev:server, dev:web]

  dev:server:
    desc: Start the API server in dev mode with watch
    dir: "{{.SERVER_DIR}}"
    env:
      EDITIONS_JWT_SECRET: editions-local-dev-secret
    cmds:
      - portless {{.PORTLESS_PREFIX}}editions-api node --experimental-strip-types --watch src/server.ts

  dev:web:
    desc: Start the web app in dev mode
    dir: "{{.WEB_DIR}}"
    env:
      VITE_API_TARGET: "http://{{.PORTLESS_PREFIX}}editions-api.localhost:1355"
    cmds:
      - portless {{.PORTLESS_PREFIX}}editions npx vite

  dev:website:
    desc: Start the website in dev mode
    dir: "{{.WEBSITE_DIR}}"
    cmds:
      - portless {{.PORTLESS_PREFIX}}editions-website sh -c 'npx astro dev --port $PORT --host 0.0.0.0'

  storybook:
    desc: Start Storybook dev server
    dir: "{{.WEB_DIR}}"
    cmds:
      - portless {{.PORTLESS_PREFIX}}editions-storybook sh -c 'npx storybook dev -p $PORT --ci'

  start:
    desc: Start the server
    dir: "{{.SERVER_DIR}}"
    env:
      EDITIONS_JWT_SECRET: editions-local-dev-secret
    cmds:
      - portless {{.PORTLESS_PREFIX}}editions-api node --experimental-strip-types src/server.ts

  generate:api:
    desc: Regenerate OpenAPI types from running server
    dir: "{{.WEB_DIR}}"
    env:
      API_URL: "http://{{.PORTLESS_PREFIX}}editions-api.localhost:1355"
    cmds:
      - pnpm generate:api

  check:
    desc: Run TypeScript type checking
    cmds:
      - pnpm --filter @editions/server check
      - pnpm --filter @editions/web check

  lint:
    desc: Run all linting (type checking for now)
    deps: [check]

  lint:eslint:
    desc: Run ESLint across the monorepo
    cmds:
      - pnpm eslint .

  license:check:
    desc: Verify production deps use an allowed license
    cmds:
      - >
        pnpm dlx license-checker --production
        --onlyAllow 'MIT;Apache-2.0;ISC;BSD-2-Clause;BSD-3-Clause;0BSD;CC0-1.0;CC-BY-3.0;CC-BY-4.0;Unlicense;Python-2.0'

  build:site:
    desc: Build the Astro marketing site (apps/website/dist)
    cmds:
      - pnpm --filter @editions/website build

  build:storybook:
    desc: Build Storybook static export (apps/web/storybook-static)
    cmds:
      - pnpm --filter @editions/web build-storybook

  build:website:
    desc: Build both site and Storybook (deploy.yaml runs the two underlying tasks)
    cmds:
      - task: build:site
      - task: build:storybook

  ci:quality:
    desc: Type-check, lint, test — what Woodpecker quality.yaml runs
    cmds:
      - task: ci:install
      - task: ci:rebuild-native
      - task: check
      - task: lint:eslint
      - task: test

  ci:compliance:
    desc: License check — what Woodpecker compliance.yaml runs
    cmds:
      - task: ci:install
      - task: license:check

  clean:
    desc: Remove build artifacts and databases
    cmds:
      - rm -f {{.SERVER_DIR}}/editions.db {{.SERVER_DIR}}/editions.db-wal {{.SERVER_DIR}}/editions.db-shm
      - rm -rf {{.SERVER_DIR}}/dist
      - rm -rf {{.WEB_DIR}}/dist

  reset-db:
    desc: Delete the database (recreated on next start)
    cmds:
      - rm -f {{.SERVER_DIR}}/editions.db {{.SERVER_DIR}}/editions.db-wal {{.SERVER_DIR}}/editions.db-shm

  test:
    desc: Run all tests
    cmds:
      - pnpm test

  test:smoke:
    desc: Start server, hit health endpoint, verify, shut down
    dir: "{{.SERVER_DIR}}"
    env:
      EDITIONS_PORT: "{{.SMOKE_PORT}}"
    cmds:
      - |
        cleanup() { kill $PID 2>/dev/null; wait $PID 2>/dev/null; rm -f editions.db editions.db-wal editions.db-shm; }
        trap cleanup EXIT
        node --experimental-strip-types src/server.ts &
        PID=$!
        sleep 2
        STATUS=$(curl -sf http://localhost:{{.SMOKE_PORT}}/api/health | python3 -c "import sys,json; print(json.load(sys.stdin)['status'])")
        if [ "$STATUS" = "ok" ]; then
          echo "Smoke test passed"
        else
          echo "Smoke test failed: expected 'ok', got '$STATUS'"
          exit 1
        fi
